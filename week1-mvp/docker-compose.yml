services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buqiqi-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL}
      SESSION_SECRET: ${SESSION_SECRET}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      DATA_DIR: /app/data
      # ADC 凭证文件路径。留空 = 用 VM 绑定的 Service Account
      # 非空 = 用挂载进来的凭证文件（通常是 gcloud auth application-default login 生成的用户账号 ADC）
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      # SQLite 数据库 + 生成图 + 上传素材都持久化在这里
      - ./data:/app/data
      # 用户账号 ADC 凭证目录（可能为空）
      # 需要时：mkdir -p ./gcp-credentials 并把 application_default_credentials.json 放进去
      - ./gcp-credentials:/app/gcp-credentials:ro
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: buqiqi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
